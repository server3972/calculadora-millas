<script>
  const STORAGE_KEY = "control_millas_v1";
  const LIMITE_MILLAS_GRANDE = 1800;

  let viajes = [];
  let ordenActual = "fecha";

  function iniciarApp() {
    cargarDatos();
    ponerFechasDeHoy();
    sugerirMillasIniciales();
    calcularEnVivo();
    mostrarViajes();
    actualizarTotales();
    avisarViajesPendientes();

    document.getElementById("millasInicio").addEventListener("input", calcularEnVivo);
    document.getElementById("millasFin").addEventListener("input", calcularEnVivo);
  }

  function cargarDatos() {
    const datos = localStorage.getItem(STORAGE_KEY);

    if (datos) {
      try {
        viajes = JSON.parse(datos);
      } catch (error) {
        viajes = [];
        alert("Hubo un problema leyendo los datos guardados.");
      }
    }
  }

  function guardarDatos() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(viajes));
  }

  function ponerFechasDeHoy() {
    const hoy = new Date().toISOString().slice(0, 10);
    document.getElementById("fechaInicio").value = hoy;
    document.getElementById("fechaFin").value = hoy;
  }

  function obtenerUltimoOdometro() {
    if (viajes.length === 0) return "";

    const ordenados = [...viajes].sort((a, b) => {
      return new Date(b.fechaFin || b.fechaInicio) - new Date(a.fechaFin || a.fechaInicio);
    });

    for (const v of ordenados) {
      if (Number(v.millasFin) > 0) {
        return Number(v.millasFin);
      }
    }

    return "";
  }

  function sugerirMillasIniciales() {
    const inputInicio = document.getElementById("millasInicio");
    const editId = document.getElementById("editId").value;

    if (editId) return;
    if (inputInicio.value) return;

    const ultimoOdometro = obtenerUltimoOdometro();

    if (ultimoOdometro) {
      inputInicio.value = ultimoOdometro;
    }
  }

  function calcularMillas() {
    const inicio = Number(document.getElementById("millasInicio").value);
    const fin = Number(document.getElementById("millasFin").value);

    if (!inicio || !fin) {
      return null;
    }

    return fin - inicio;
  }

  function calcularEnVivo() {
    const resultado = document.getElementById("resultado");
    const inicio = Number(document.getElementById("millasInicio").value);
    const fin = Number(document.getElementById("millasFin").value);
    const millas = calcularMillas();

    if (inicio && !fin) {
      resultado.style.display = "block";
      resultado.style.background = "#451a03";
      resultado.style.borderColor = "#f59e0b";
      resultado.style.color = "#fde68a";
      resultado.textContent = "🚛 Viaje pendiente: ya tienes millas iniciales, faltan millas finales.";
      return;
    }

    if (millas === null) {
      resultado.style.display = "none";
      return;
    }

    if (millas < 0) {
      resultado.style.display = "block";
      resultado.style.background = "#450a0a";
      resultado.style.borderColor = "#ef4444";
      resultado.style.color = "#fecaca";
      resultado.textContent = "⚠️ Las millas finales no pueden ser menores que las iniciales.";
      return;
    }

    if (millas > LIMITE_MILLAS_GRANDE) {
      resultado.style.display = "block";
      resultado.style.background = "#451a03";
      resultado.style.borderColor = "#f59e0b";
      resultado.style.color = "#fde68a";
      resultado.textContent = "⚠️ Revisa el odómetro: este viaje marca " + millas.toLocaleString("en-US") + " millas.";
      return;
    }

    resultado.style.display = "block";
    resultado.style.background = "#052e16";
    resultado.style.borderColor = "#16a34a";
    resultado.style.color = "#bbf7d0";
    resultado.textContent = "✅ Total de este viaje: " + millas.toLocaleString("en-US") + " millas";
  }

  function validarMillas(millasInicio, millasFin) {
    if (!millasInicio || millasInicio <= 0) {
      alert("Pon las millas iniciales.");
      return false;
    }

    if (!millasFin || millasFin <= 0) {
      return confirm("🚛 Este viaje quedará PENDIENTE porque faltan las millas finales.\n\n¿Quieres guardarlo así?");
    }

    const millasTotal = millasFin - millasInicio;

    if (millasTotal < 0) {
      alert("Las millas finales no pueden ser menores que las iniciales.");
      return false;
    }

    if (millasTotal > LIMITE_MILLAS_GRANDE) {
      return confirm(
        "⚠️ Revisa el odómetro.\n\n" +
        "Este viaje marca " + millasTotal.toLocaleString("en-US") + " millas.\n\n" +
        "¿Seguro que quieres guardarlo así?"
      );
    }

    return true;
  }

  function guardarViaje() {
    const editId = document.getElementById("editId").value;

    const fechaInicio = document.getElementById("fechaInicio").value;
    const fechaFin = document.getElementById("fechaFin").value;
    const origen = document.getElementById("origen").value.trim();
    const destino = document.getElementById("destino").value.trim();
    const millasInicio = Number(document.getElementById("millasInicio").value);
    const millasFin = Number(document.getElementById("millasFin").value);
    const tipoViaje = document.getElementById("tipoViaje").value;
    const notas = document.getElementById("notas").value.trim();

    if (!fechaInicio || !fechaFin) {
      alert("Pon la fecha de inicio y la fecha final.");
      return;
    }

    if (!validarMillas(millasInicio, millasFin)) {
      return;
    }

    const millasTotal = millasFin > 0 ? millasFin - millasInicio : 0;
    const pendiente = !millasFin || millasFin <= 0;

    const viaje = {
      id: editId || crypto.randomUUID(),
      fechaInicio,
      fechaFin,
      origen,
      destino,
      millasInicio,
      millasFin,
      millasTotal,
      pendiente,
      tipoViaje,
      notas,
      creado: editId ? obtenerFechaCreado(editId) : new Date().toISOString(),
      actualizado: new Date().toISOString()
    };

    if (editId) {
      viajes = viajes.map(v => v.id === editId ? viaje : v);
    } else {
      viajes.push(viaje);
    }

    guardarDatos();
    limpiarFormulario();
    sugerirMillasIniciales();
    mostrarViajes();
    actualizarTotales();

    alert(pendiente ? "Viaje guardado como pendiente 🚛" : "Viaje guardado correctamente, my friend ✅");
  }

  function obtenerFechaCreado(id) {
    const viaje = viajes.find(v => v.id === id);
    return viaje?.creado || new Date().toISOString();
  }

  function limpiarFormulario() {
    document.getElementById("editId").value = "";
    document.getElementById("formTitle").textContent = "➕ Nuevo viaje";

    document.getElementById("origen").value = "";
    document.getElementById("destino").value = "";
    document.getElementById("millasInicio").value = "";
    document.getElementById("millasFin").value = "";
    document.getElementById("tipoViaje").value = "Trabajo";
    document.getElementById("notas").value = "";

    ponerFechasDeHoy();
    sugerirMillasIniciales();

    const resultado = document.getElementById("resultado");
    resultado.style.display = "none";
  }

  function mostrarViajes() {
    const lista = document.getElementById("listaViajes");
    const buscar = document.getElementById("buscar").value.toLowerCase().trim();

    let viajesFiltrados = viajes.filter(v => {
      const texto = `
        ${v.fechaInicio}
        ${v.fechaFin}
        ${v.origen}
        ${v.destino}
        ${v.tipoViaje}
        ${v.notas}
        ${v.millasTotal}
        ${v.pendiente ? "pendiente" : ""}
      `.toLowerCase();

      return texto.includes(buscar);
    });

    if (ordenActual === "fecha") {
      viajesFiltrados.sort((a, b) => new Date(b.fechaFin) - new Date(a.fechaFin));
    }

    if (ordenActual === "millas") {
      viajesFiltrados.sort((a, b) => Number(b.millasTotal || 0) - Number(a.millasTotal || 0));
    }

    if (viajesFiltrados.length === 0) {
      lista.innerHTML = `<div class="empty">Todavía no hay viajes guardados.</div>`;
      return;
    }

    lista.innerHTML = viajesFiltrados.map(v => {
      const pendiente = v.pendiente || !v.millasFin || Number(v.millasFin) <= 0;

      return `
        <div class="trip" style="${pendiente ? "border-color:#f59e0b;" : ""}">
          <div class="trip-top">
            <div class="trip-title">
              ${pendiente ? "⚠️ " : ""}${escaparHTML(v.origen || "Sin origen")} → ${escaparHTML(v.destino || "Sin destino")}
            </div>

            <div class="trip-miles" style="${pendiente ? "color:#f59e0b;" : ""}">
              ${pendiente ? "Pendiente" : Number(v.millasTotal).toLocaleString("en-US") + " mi"}
            </div>
          </div>

          <div class="trip-details">
            <div>📅 Inicio: <b>${formatearFecha(v.fechaInicio)}</b></div>
            <div>📅 Final: <b>${formatearFecha(v.fechaFin)}</b></div>
            <div>🚛 Tipo: <b>${escaparHTML(v.tipoViaje)}</b></div>
            <div>
              🔢 Inicial: ${Number(v.millasInicio).toLocaleString("en-US")}
              |
              Final: ${pendiente ? "<b style='color:#f59e0b;'>Falta capturar</b>" : Number(v.millasFin).toLocaleString("en-US")}
            </div>
            ${pendiente ? `<div style="color:#f59e0b;"><b>🚛 Este viaje está pendiente de millas finales.</b></div>` : ""}
            ${v.notas ? `<div>📝 Notas: ${escaparHTML(v.notas)}</div>` : ""}
          </div>

          <div class="trip-actions">
            <button class="btn-dark" onclick="editarViaje('${v.id}')">✏️ Editar</button>
            <button class="btn-share" onclick="compartirUnViaje('${v.id}')">📲 Compartir</button>
            <button class="btn-danger" onclick="borrarViaje('${v.id}')">🗑️ Borrar</button>
          </div>
        </div>
      `;
    }).join("");
  }

  function editarViaje(id) {
    const viaje = viajes.find(v => v.id === id);
    if (!viaje) return;

    document.getElementById("editId").value = viaje.id;
    document.getElementById("formTitle").textContent = "✏️ Editando viaje";

    document.getElementById("fechaInicio").value = viaje.fechaInicio;
    document.getElementById("fechaFin").value = viaje.fechaFin;
    document.getElementById("origen").value = viaje.origen;
    document.getElementById("destino").value = viaje.destino;
    document.getElementById("millasInicio").value = viaje.millasInicio;
    document.getElementById("millasFin").value = viaje.millasFin || "";
    document.getElementById("tipoViaje").value = viaje.tipoViaje;
    document.getElementById("notas").value = viaje.notas;

    calcularEnVivo();

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }

  function borrarViaje(id) {
    const confirmar = confirm("¿Seguro que quieres borrar este viaje?");
    if (!confirmar) return;

    viajes = viajes.filter(v => v.id !== id);
    guardarDatos();
    mostrarViajes();
    actualizarTotales();
  }

  function borrarTodo() {
    if (viajes.length === 0) {
      alert("No hay viajes para borrar.");
      return;
    }

    const confirmar = confirm("¿Seguro que quieres borrar TODO el historial de millas?");
    if (!confirmar) return;

    viajes = [];
    guardarDatos();
    mostrarViajes();
    actualizarTotales();
    limpiarFormulario();
  }

  function actualizarTotales() {
    const totalViajes = viajes.length;
    const totalMillas = viajes.reduce((acc, v) => acc + Number(v.millasTotal || 0), 0);

    let ultimaMilla = 0;

    if (viajes.length > 0) {
      const completados = viajes.filter(v => Number(v.millasFin) > 0);
      const ordenados = [...completados].sort((a, b) => new Date(b.fechaFin) - new Date(a.fechaFin));
      ultimaMilla = ordenados[0]?.millasTotal || 0;
    }

    document.getElementById("totalViajes").textContent = totalViajes.toLocaleString("en-US");
    document.getElementById("totalMillas").textContent = totalMillas.toLocaleString("en-US");
    document.getElementById("ultimaMilla").textContent = Number(ultimaMilla).toLocaleString("en-US");
  }

  function avisarViajesPendientes() {
    const pendientes = viajes.filter(v => v.pendiente || !v.millasFin || Number(v.millasFin) <= 0);

    if (pendientes.length > 0) {
      setTimeout(() => {
        alert("🚛 Tienes " + pendientes.length + " viaje(s) pendiente(s) sin millas finales.");
      }, 700);
    }
  }

  function ordenarPorFecha() {
    ordenActual = "fecha";
    mostrarViajes();
  }

  function ordenarPorMillas() {
    ordenActual = "millas";
    mostrarViajes();
  }

  function crearReporteGeneral() {
    const totalMillas = viajes.reduce((acc, v) => acc + Number(v.millasTotal || 0), 0);

    if (viajes.length === 0) {
      return "Reporte de millas\n\nNo hay viajes guardados todavía.";
    }

    let reporte = "🚛 Reporte de millas\n\n";
    reporte += "Viajes guardados: " + viajes.length + "\n";
    reporte += "Millas totales: " + totalMillas.toLocaleString("en-US") + " mi\n\n";

    const ordenados = [...viajes].sort((a, b) => new Date(b.fechaFin) - new Date(a.fechaFin));

    ordenados.forEach((v, index) => {
      const pendiente = v.pendiente || !v.millasFin || Number(v.millasFin) <= 0;

      reporte += `${index + 1}. ${v.origen || "Sin origen"} → ${v.destino || "Sin destino"}\n`;
      reporte += `   Fecha: ${v.fechaInicio} a ${v.fechaFin}\n`;
      reporte += `   Inicial: ${Number(v.millasInicio).toLocaleString("en-US")}\n`;

      if (pendiente) {
        reporte += `   Final: PENDIENTE\n`;
        reporte += `   Total: PENDIENTE\n`;
      } else {
        reporte += `   Final: ${Number(v.millasFin).toLocaleString("en-US")}\n`;
        reporte += `   Total: ${Number(v.millasTotal).toLocaleString("en-US")} mi\n`;
      }

      if (v.notas) {
        reporte += `   Notas: ${v.notas}\n`;
      }

      reporte += "\n";
    });

    return reporte;
  }

  function crearReporteDeViaje(v) {
    const pendiente = v.pendiente || !v.millasFin || Number(v.millasFin) <= 0;

    let reporte = "🚛 Reporte de viaje\n\n";
    reporte += `Origen: ${v.origen || "Sin origen"}\n`;
    reporte += `Destino: ${v.destino || "Sin destino"}\n`;
    reporte += `Fecha inicio: ${v.fechaInicio}\n`;
    reporte += `Fecha final: ${v.fechaFin}\n`;
    reporte += `Millas iniciales: ${Number(v.millasInicio).toLocaleString("en-US")}\n`;

    if (pendiente) {
      reporte += `Millas finales: PENDIENTE\n`;
      reporte += `Total: PENDIENTE\n`;
    } else {
      reporte += `Millas finales: ${Number(v.millasFin).toLocaleString("en-US")}\n`;
      reporte += `Total: ${Number(v.millasTotal).toLocaleString("en-US")} mi\n`;
    }

    reporte += `Tipo: ${v.tipoViaje}\n`;

    if (v.notas) {
      reporte += `Notas: ${v.notas}\n`;
    }

    return reporte;
  }

  async function compartirReporte() {
    const reporte = crearReporteGeneral();

    if (navigator.share) {
      try {
        await navigator.share({
          title: "Reporte de millas",
          text: reporte
        });
      } catch (error) {
        copiarTexto(reporte);
      }
    } else {
      copiarTexto(reporte);
    }
  }

  async function compartirUnViaje(id) {
    const viaje = viajes.find(v => v.id === id);
    if (!viaje) return;

    const reporte = crearReporteDeViaje(viaje);

    if (navigator.share) {
      try {
        await navigator.share({
          title: "Reporte de viaje",
          text: reporte
        });
      } catch (error) {
        copiarTexto(reporte);
      }
    } else {
      copiarTexto(reporte);
    }
  }

  function copiarTexto(texto) {
    navigator.clipboard.writeText(texto)
      .then(() => {
        alert("Reporte copiado. Ya lo puedes pegar en WhatsApp o mensaje ✅");
      })
      .catch(() => {
        alert("No se pudo copiar automáticamente. Selecciona y copia manualmente:\n\n" + texto);
      });
  }

  function exportarDatos() {
    const backup = {
      app: "Control de Millas",
      version: "1.1",
      fechaBackup: new Date().toISOString(),
      viajes
    };

    const contenido = JSON.stringify(backup, null, 2);
    const blob = new Blob([contenido], { type: "application/json" });
    const url = URL.createObjectURL(blob);

    const enlace = document.createElement("a");
    enlace.href = url;
    enlace.download = "backup-millas.json";
    enlace.click();

    URL.revokeObjectURL(url);
  }

  function importarDatos(event) {
    const archivo = event.target.files[0];
    if (!archivo) return;

    const lector = new FileReader();

    lector.onload = function(e) {
      try {
        const contenido = JSON.parse(e.target.result);

        let viajesImportados = [];

        if (Array.isArray(contenido)) {
          viajesImportados = contenido;
        } else if (Array.isArray(contenido.viajes)) {
          viajesImportados = contenido.viajes;
        } else {
          alert("El archivo no tiene el formato correcto.");
          return;
        }

        const confirmar = confirm(
          "¿Quieres importar estos viajes?\n\n" +
          "Aceptar = se agregan al historial actual.\n" +
          "Cancelar = no se importa nada."
        );

        if (!confirmar) return;

        viajesImportados.forEach(v => {
          if (!v.id) v.id = crypto.randomUUID();

          if (!v.millasFin || Number(v.millasFin) <= 0) {
            v.pendiente = true;
            v.millasTotal = 0;
          } else {
            v.pendiente = false;
            v.millasTotal = Number(v.millasFin) - Number(v.millasInicio);
          }
        });

        viajes = [...viajes, ...viajesImportados];

        guardarDatos();
        mostrarViajes();
        actualizarTotales();
        sugerirMillasIniciales();

        alert("Backup importado correctamente ✅");

      } catch (error) {
        alert("No se pudo leer el archivo JSON.");
      }
    };

    lector.readAsText(archivo);
    event.target.value = "";
  }

  function formatearFecha(fecha) {
    if (!fecha) return "";

    const partes = fecha.split("-");
    if (partes.length !== 3) return fecha;

    return `${partes[1]}/${partes[2]}/${partes[0]}`;
  }

  function escaparHTML(texto) {
    if (texto === null || texto === undefined) return "";

    return String(texto)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  iniciarApp();
</script>
